[package]
name = "rdesk"
description = "Native Linux Remote Desktop client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rdesk"
path = "src/main.rs"

[dependencies]
rdesk-core.workspace = true
rdesk-input.workspace = true
# v4_16: incremental texture updates (GdkMemoryTextureBuilder update region).
gtk4 = { workspace = true, features = ["v4_16"] }
libadwaita.workspace = true
tokio.workspace = true
async-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
