[workspace]
resolver = "3"
members = [
    "crates/porthole-core",
    "crates/porthole-gfx",
    "crates/porthole-input",
    "crates/porthole-channels",
    "crates/porthole-store",
    "crates/porthole-workspaces",
    "crates/porthole-gateway",
    "crates/porthole-audio",
    "crates/porthole-camera",
    "app",
    "cli",
    "spikes/rdp-screenshot",
    "spikes/gtk-texture",
]
# `app`, `porthole-audio`, `porthole-camera` and `spikes/gtk-texture` need system libraries (GTK4/libadwaita, PipeWire + libclang);
# everything else builds with only a Rust toolchain.
default-members = [
    "crates/porthole-core",
    "crates/porthole-gfx",
    "crates/porthole-input",
    "crates/porthole-channels",
    "crates/porthole-store",
    "crates/porthole-workspaces",
    "crates/porthole-gateway",
    "cli",
    "spikes/rdp-screenshot",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vladgb/porthole"
rust-version = "1.88"

[workspace.dependencies]
# Internal crates
porthole-core = { path = "crates/porthole-core" }
porthole-gfx = { path = "crates/porthole-gfx" }
porthole-input = { path = "crates/porthole-input" }
porthole-channels = { path = "crates/porthole-channels" }
porthole-store = { path = "crates/porthole-store" }
porthole-workspaces = { path = "crates/porthole-workspaces" }
porthole-gateway = { path = "crates/porthole-gateway" }
porthole-audio = { path = "crates/porthole-audio" }
porthole-camera = { path = "crates/porthole-camera" }

# RDP stack. sspi/x509-cert are pinned to the versions ironrdp-connector 0.10 uses.
ironrdp = { version = "0.17", features = ["core", "connector", "session", "graphics", "pdu", "input", "svc", "dvc", "cliprdr", "displaycontrol", "rdpsnd", "rdpdr"] }
ironrdp-blocking = "0.10"
ironrdp-tokio = "0.10"
ironrdp-tls = { version = "0.2", features = ["rustls"] }
sspi = { version = "0.21", features = ["network_client", "dns_resolver"] }
url = "2"
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
x509-cert = { version = "0.2", features = ["std"] }
sha2 = "0.10"
ironrdp-egfx = "0.3"
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }
ironrdp-rdpsnd = "0.9"
ironrdp-cliprdr-format = "0.2"
pipewire = { version = "0.10", features = ["v0_3_49"] }

# Runtime & plumbing
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
async-channel = "2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
uuid = { version = "1", features = ["v4", "serde"] }
oo7 = { version = "0.5", default-features = false, features = ["tokio", "native_crypto"] }
zeroize = "1"
rustix = { version = "1", features = ["fs"] }
tempfile = "3"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rpassword = "7"

# UI
gtk4 = { version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_5"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

# Local patches to upstream crates; see vendor/README.md.
[patch.crates-io]
ironrdp-connector = { path = "vendor/ironrdp-connector" }
ironrdp-rdpsnd = { path = "vendor/ironrdp-rdpsnd" }
