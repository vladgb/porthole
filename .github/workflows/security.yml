name: Security
on:
  push:
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - deny.toml
      - .github/workflows/security.yml
  pull_request:
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - deny.toml
      - .github/workflows/security.yml
  # New advisories are published without any change here, so check every day as well.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Known vulnerabilities (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --workspace
